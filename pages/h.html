<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Form</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">

    <!-- Left Section -->
    <div class="bg-black text-white p-10 flex flex-col justify-center">
      <h1 class="text-4xl font-bold mb-4">
        Welcome Back
      </h1>

      <p class="text-gray-300 leading-relaxed">
        Build beautiful modern forms using HTML and Tailwind CSS.
        Fast, responsive, clean, and professional UI design.
      </p>

      <div class="mt-8 space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 bg-white rounded-full"></div>
          <p class="text-gray-300">Responsive Layout</p>
        </div>

        <div class="flex items-center gap-3">
          <div class="w-3 h-3 bg-white rounded-full"></div>
          <p class="text-gray-300">Modern Tailwind UI</p>
        </div>

        <div class="flex items-center gap-3">
          <div class="w-3 h-3 bg-white rounded-full"></div>
          <p class="text-gray-300">Single File Structure</p>
        </div>
      </div>
    </div>

    <!-- Right Section -->
    <div class="p-10">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-black">
          Create Account
        </h2>

        <p class="text-gray-500 mt-2">
          Fill all fields below
        </p>
      </div>

      <form class="space-y-5">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Full Name
          </label>

          <input
            type="text"
            placeholder="Enter your full name"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-black"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Email Address
          </label>

          <input
            type="email"
            placeholder="Enter your email"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-black"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Password
          </label>

          <input
            type="password"
            placeholder="Enter password"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-black"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Message
          </label>

          <textarea
            rows="4"
            placeholder="Write something..."
            class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-black resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-black text-white py-3 rounded-xl font-semibold hover:scale-[1.02] duration-300"
        >
          Submit Form
        </button>

      </form>
    </div>

  </div>

</body>
</html>
